<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Slopetanium</title>
<link rel="icon" href="/static/icons/slopetanium-mark.png">
<style>
@font-face { font-family: "Pixelify"; src: url("/static/fonts/PixelifySans-Medium.ttf") format("truetype"); font-display: swap; }

:root {
  --bg: #0e1219; --bg-2: #121722; --surface: #161c27; --surface-2: #1c2331; --surface-3: #232b3b;
  --line: #273041; --line-2: #323d52;
  --text: #e9eef7; --muted: #95a1b6; --faint: #66728a;
  --accent: #3ed9b0; --accent-2: #7febcb; --accent-ink: #04261d; --accent-soft: rgba(62, 217, 176, .13);
  --warn: #ffb547; --warn-soft: rgba(255, 181, 71, .14);
  --danger: #ff5d6c; --danger-soft: rgba(255, 93, 108, .13);
  --info: #6aa7ff; --info-soft: rgba(106, 167, 255, .14);
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.28);
  --shadow-lg: 0 24px 60px rgba(0,0,0,.5);
  --r: 14px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f5f9; --bg-2: #eef1f6; --surface: #ffffff; --surface-2: #f6f8fb; --surface-3: #edf1f6;
    --line: #e1e6ee; --line-2: #d3dae5; --text: #131925; --muted: #5a6579; --faint: #8a94a6;
    --accent: #10a684; --accent-2: #0c8a6d; --accent-ink: #ffffff; --accent-soft: rgba(16, 166, 132, .11);
    --warn: #c47a00; --warn-soft: rgba(230, 150, 20, .13); --danger: #d8334a; --danger-soft: rgba(216, 51, 74, .1);
    --info: #2f6fd8; --info-soft: rgba(47, 111, 216, .1);
    --shadow: 0 1px 2px rgba(20,30,50,.06), 0 8px 24px rgba(20,30,50,.07); --shadow-lg: 0 24px 60px rgba(20,30,50,.22);
  }
}
:root[data-theme="light"] {
  --bg: #f3f5f9; --bg-2: #eef1f6; --surface: #ffffff; --surface-2: #f6f8fb; --surface-3: #edf1f6;
  --line: #e1e6ee; --line-2: #d3dae5; --text: #131925; --muted: #5a6579; --faint: #8a94a6;
  --accent: #10a684; --accent-2: #0c8a6d; --accent-ink: #ffffff; --accent-soft: rgba(16, 166, 132, .11);
  --warn: #c47a00; --warn-soft: rgba(230, 150, 20, .13); --danger: #d8334a; --danger-soft: rgba(216, 51, 74, .1);
  --info: #2f6fd8; --info-soft: rgba(47, 111, 216, .1);
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 8px 24px rgba(20,30,50,.07); --shadow-lg: 0 24px 60px rgba(20,30,50,.22);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body::before {   /* the slope: faint diagonals across the top of the page */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; opacity: .5;
  background: repeating-linear-gradient(135deg, transparent 0 13px, color-mix(in srgb, var(--line) 45%, transparent) 13px 14px);
  -webkit-mask-image: linear-gradient(180deg, #000, transparent 70%); mask-image: linear-gradient(180deg, #000, transparent 70%);
}
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
img { display: block; }
code { background: var(--surface-3); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
.pixel { font-family: "Pixelify", ui-sans-serif, system-ui, sans-serif; font-weight: normal; letter-spacing: .02em; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.small { font-size: 13px; } .tiny { font-size: 12px; }
.grow { flex: 1 1 auto; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: grid; gap: 14px; }
.hidden { display: none !important; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- app bar ---------- */
.bar { position: sticky; top: 0; z-index: 20; backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1180px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand img { width: 34px; height: 34px; filter: drop-shadow(0 3px 8px rgba(255, 90, 60, .25)); }
.brand .word { font-size: 22px; line-height: 1; }
.brand .word b { color: var(--accent); font-weight: normal; }
.nav { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); padding: 4px; border-radius: 12px; }
.nav a { text-decoration: none; padding: 6px 13px; border-radius: 9px; color: var(--muted); font-weight: 550; font-size: 14px;
  display: flex; align-items: center; gap: 7px; transition: background .15s, color .15s; }
.nav a:hover { color: var(--text); background: var(--surface-2); }
.nav a.on { color: var(--text); background: var(--surface-3); }
.nav .count { background: var(--warn); color: #1d1300; border-radius: 99px; font-size: 11px; font-weight: 700; padding: 0 6px; line-height: 17px; }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.stat { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; padding: 0 4px; white-space: nowrap; }
.stat svg { width: 16px; height: 16px; }
.stat.low { color: var(--danger); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 15px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--surface-2); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap;
  text-decoration: none; color: var(--text); transition: transform .06s, background .15s, border-color .15s; user-select: none; }
.btn:hover { background: var(--surface-3); border-color: var(--faint); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .nav a:focus-visible, .tab:focus-visible, .card-hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .45; cursor: default; transform: none; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); box-shadow: 0 6px 18px -8px var(--accent); }
.btn.primary:hover { background: var(--accent-2); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line-2)); background: var(--danger-soft); }
.btn.danger:hover { background: color-mix(in srgb, var(--danger) 20%, transparent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.sm { height: 32px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.btn.icon { width: 38px; padding: 0; }
.btn.sm.icon { width: 32px; }

/* ---------- layout ---------- */
main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 90px; }
.page-head { display: flex; align-items: flex-end; gap: 12px; margin: 6px 0 18px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 28px; line-height: 1.1; }
.page-head p { margin: 4px 0 0; }
.section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.section > header { padding: 16px 18px 0; }
.section > header h2 { margin: 0; font-size: 17px; }
.section > header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.section > .content { padding: 16px 18px 18px; }

/* ---------- badges & chips ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 99px; font-size: 12.5px; font-weight: 650; white-space: nowrap; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.b-current { color: var(--accent); background: var(--accent-soft); }
.b-update, .b-unknown_version { color: var(--warn); background: var(--warn-soft); }
.b-not_installed { color: var(--muted); background: var(--surface-3); }
.b-error, .b-failed { color: var(--danger); background: var(--danger-soft); }
.b-working { color: var(--info); background: var(--info-soft); }
.b-working::before { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); text-decoration: none; white-space: nowrap; }
a.chip:hover { color: var(--text); border-color: var(--line-2); }
.chip svg { width: 14px; height: 14px; }
.chip.ok { color: var(--accent); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--danger); }

/* ---------- library ---------- */
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.search { position: relative; flex: 1 1 240px; max-width: 380px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.search input { padding-left: 40px !important; }
.search svg { z-index: 1; pointer-events: none; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; }
.seg button.on { background: var(--surface-3); color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.card { position: relative; display: grid; grid-template-columns: 104px 1fr; gap: 16px; padding: 14px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); transition: border-color .15s, transform .15s, box-shadow .15s; }
.card:hover { border-color: var(--line-2); transform: translateY(-2px); box-shadow: var(--shadow), 0 14px 30px -18px rgba(0,0,0,.6); }
.card.attn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.card-hit { position: absolute; inset: 0; border-radius: var(--r); z-index: 1; }
.cover { position: relative; width: 104px; aspect-ratio: 3 / 4; border-radius: 9px; overflow: hidden; background: var(--surface-3);
  box-shadow: 0 10px 22px -10px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.05) inset; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.cover img.bg { position: absolute; inset: -12%; width: 124%; height: 124%; filter: blur(14px) brightness(.55) saturate(1.2); }
.cover img.fg { position: relative; }
.cover.wide img.fg { object-fit: contain; }
.cover .ph { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Pixelify", sans-serif; font-size: 34px; color: rgba(255,255,255,.88);
  background: linear-gradient(150deg, var(--c1), var(--c2)); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,.14), transparent 40%); pointer-events: none; }
.card-body { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.card-top { display: grid; gap: 2px; }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.meta b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
.meta .vtag { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.meta svg { width: 14px; height: 14px; color: var(--faint); }
.card h3 { margin: 0; font-size: 16.5px; line-height: 1.25; font-weight: 700; }
.card .repo { font-size: 12.5px; color: var(--faint); text-decoration: none; position: relative; z-index: 2; }
.card .repo:hover { color: var(--muted); text-decoration: underline; }
.vers { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.vers b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
.vers svg { width: 14px; height: 14px; color: var(--faint); }
.card .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.card-actions { margin-top: auto; display: flex; gap: 8px; align-items: center; position: relative; z-index: 2; }
.progress { height: 6px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width .35s; }
.progress.indet > i { width: 30% !important; animation: indet 1.2s ease-in-out infinite; }
@keyframes indet { from { transform: translateX(-110%); } to { transform: translateX(340%); } }
.job-line { font-size: 12.5px; color: var(--info); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job-line.bad { color: var(--danger); }
.empty { text-align: center; padding: 56px 20px; color: var(--muted); }
.empty img { width: 72px; height: 72px; margin: 0 auto 14px; }
.empty h2 { color: var(--text); margin: 0 0 6px; font-size: 19px; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(5, 8, 13, .55); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); z-index: 41; background: var(--bg-2);
  border-left: 1px solid var(--line); box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
  transform: translateX(104%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); }
.drawer.on { transform: none; }
.d-head { display: grid; grid-template-columns: 76px 1fr auto; gap: 16px; padding: 18px 20px 14px; align-items: start; border-bottom: 1px solid var(--line); }
.d-head .cover { width: 76px; }
.d-head h2 { margin: 0 0 6px; font-size: 20px; line-height: 1.2; }
.tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 12px 10px; color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.d-body { flex: 1; overflow-y: auto; padding: 18px 20px 30px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 10px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; min-width: 0; }
.fact .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 650; }
.fact .v { font-weight: 650; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.panel h3 { margin: 0 0 8px; font-size: 14.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel.callout { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.panel.danger { border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.md { font-size: 14px; color: var(--text); overflow-wrap: anywhere; }
.md h4 { margin: 12px 0 4px; font-size: 14px; }
.md p { margin: 6px 0; color: var(--muted); }
.md ul { margin: 4px 0 8px; padding-left: 20px; color: var(--muted); }
.md li { margin: 3px 0; }
.md a { color: var(--accent); }
.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .t { font-weight: 650; }
.li .acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
details.notes summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details.notes .md { margin-top: 8px; padding: 10px 12px; background: var(--surface-2); border-radius: 9px; }

/* ---------- forms ---------- */
label.f { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; align-content: start; }
label.f .hint { font-weight: 400; color: var(--faint); font-size: 12.5px; }
input[type=text], input[type=number], input[type=password], input:not([type]) {
  height: 40px; width: 100%; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg-2); transition: border-color .15s, box-shadow .15s; }
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
details.adv > summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13.5px; margin: 4px 0; }

/* ---------- drop zone ---------- */
.drop { border: 1.5px dashed var(--line-2); border-radius: 14px; padding: 26px 18px; text-align: center; background: var(--surface); transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg.big { width: 36px; height: 36px; color: var(--accent); margin: 0 auto 8px; display: block; }
.drop h3 { margin: 0 0 4px; font-size: 16px; }
.up-list { margin-top: 12px; display: grid; gap: 8px; text-align: left; }
.up-item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
.up-item .progress { grid-column: 1 / -1; }

/* ---------- catalogue, activity ---------- */
.cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.cat-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
.cat-item .ph { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; font-family: "Pixelify", sans-serif; color: #fff; background: linear-gradient(150deg, var(--c1), var(--c2)); flex: none; }
.log { font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; max-height: 420px; overflow: auto;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--muted); }
.jobs .li .badge { min-width: 86px; justify-content: center; }

/* ---------- dialog, toasts, menu, uploader ---------- */
dialog { border: 1px solid var(--line-2); border-radius: 16px; background: var(--surface); color: var(--text); padding: 0; width: min(460px, calc(100vw - 32px)); box-shadow: var(--shadow-lg); }
dialog::backdrop { background: rgba(5, 8, 13, .6); }
dialog .dl-in { padding: 20px 20px 16px; }
dialog h3 { margin: 0 0 8px; font-size: 18px; }
dialog .dl-acts { display: flex; justify-content: flex-end; gap: 8px; padding: 0 20px 18px; }
.toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 60; max-width: min(380px, calc(100vw - 36px)); }
.toast { background: var(--surface-3); border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 14px; box-shadow: var(--shadow-lg);
  display: flex; gap: 10px; align-items: flex-start; font-size: 14px; animation: tin .22s ease-out; }
.toast svg { color: var(--accent); margin-top: 1px; } .toast.bad svg { color: var(--danger); }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }
.menu { position: fixed; z-index: 50; min-width: 210px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 6px; box-shadow: var(--shadow-lg); }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; border: 0; background: none; padding: 9px 10px; border-radius: 8px; font-size: 14px; cursor: pointer; text-align: left; color: var(--text); }
.menu button:hover { background: var(--surface-3); }
.menu button.bad { color: var(--danger); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
.uploader { position: fixed; left: 18px; bottom: 18px; z-index: 55; background: var(--surface-3); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 14px; width: 290px; box-shadow: var(--shadow-lg); font-size: 13px; }

/* ---------- login ---------- */
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.login .box { width: min(380px, 100%); text-align: center; }
.login img { width: 96px; height: 96px; margin: 0 auto 10px; filter: drop-shadow(0 10px 24px rgba(255, 90, 60, .3)); }
.login h1 { margin: 0; font-size: 34px; }
.pin { display: flex; gap: 10px; justify-content: center; margin: 22px 0 12px; }
.pin input { width: 58px; height: 66px; text-align: center; font-size: 30px; font-family: "Pixelify", sans-serif; border-radius: 14px; padding: 0; }

/* ---------- small screens ---------- */
@media (max-width: 760px) {
  .bar-in { padding: 10px 14px; gap: 10px; flex-wrap: wrap; }
  .brand .word { font-size: 19px; }
  .nav { order: 3; width: 100%; }
  .nav a { flex: 1; justify-content: center; padding: 7px 6px; }
  .nav a span.lbl { display: none; }
  .stat.hide-sm { display: none; }
  main { padding: 16px 14px 90px; }
  .page-head h1 { font-size: 23px; }
  .grid { grid-template-columns: 1fr; }
  .card { grid-template-columns: 84px 1fr; gap: 13px; }

<script>
'use strict';
// ---------------------------------------------------------------- basics
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = (n, cls = 'i') => `<svg class="${cls}"><use href="#i-${n}"/></svg>`;
const size = n => { n = +n || 0; for (const u of ['B', 'KB', 'MB', 'GB', 'TB']) { if (n < 1024 || u === 'TB') return (u === 'B' ? n : n.toFixed(n < 10 ? 1 : 0)) + ' ' + u; n /= 1024; } };
const ago = t => { if (!t) return 'never'; const s = Date.now() / 1000 - t; if (s < 60) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min ago'; if (s < 86400) return Math.round(s / 3600) + ' h ago'; return Math.round(s / 86400) + ' d ago'; };
const day = iso => iso ? new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';
const dur = s => s < 90 ? Math.round(s) + ' s' : s < 5400 ? Math.round(s / 60) + ' min' : (s / 3600).toFixed(1) + ' h';
// a release tag short enough to read: portmaster-v20261107-lan-alpha -> 2026.11.07
function shortTag(t) {
  if (!t) return '—';
  const s = t.replace(/^portmaster-/, '');
  const m = s.match(/^v?(\d{4})(\d{2})(\d{2})(\d{2,6})?([-_]|$)/);
  if (m) return `${m[1]}.${m[2]}.${m[3]}`;
  return s.length > 16 ? s.slice(0, 15) + '…' : s;
}
const TINTS = [['#ff7a59', '#b8326a'], ['#3ed9b0', '#1f6f8b'], ['#6aa7ff', '#5b3fd1'], ['#ffb547', '#d4542b'], ['#c06bff', '#5038c7'], ['#2bd4d4', '#227a52']];
const tint = s => TINTS[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % TINTS.length];
const initials = s => (String(s).match(/[A-Za-z0-9]+/g) || ['?']).slice(0, 2).map(w => w[0]).join('').toUpperCase();

let PIN = '';
try { PIN = localStorage.getItem('slop_pin') || ''; } catch (_) {}
{ const q = new URLSearchParams(location.search).get('pin'); if (q) { PIN = q; try { localStorage.setItem('slop_pin', q); } catch (_) {} history.replaceState(null, '', location.pathname + location.hash); } }

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'X-Pin': PIN, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw Object.assign(new Error(j.error || 'PIN'), { status: 401 }); }
  if (!r.ok) throw Object.assign(new Error(j.error || 'Error ' + r.status), { status: r.status, body: j });
  return j;
}
async function act(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r) : okMsg); poll(); return r; }
  catch (e) { if (e.status !== 401) toast(e.message, true); return null; }
}
const dl = (id, q) => `/api/repos/${id}/${q}${q.includes('?') ? '&' : '?'}pin=${encodeURIComponent(PIN)}`;
const coverUrl = r => `/api/repos/${r.id}/cover?pin=${encodeURIComponent(PIN)}&v=${r.cover ? 'c' : 'a'}${(r.cover || r.art || '').length}`;

// ---------------------------------------------------------------- theme
function toggleTheme() {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('slop_theme', next); } catch (_) {}
}
try { const t = localStorage.getItem('slop_theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}

// ---------------------------------------------------------------- toasts, dialogs, menus
function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.innerHTML = ico(bad ? 'alert' : 'check') + `<div>${esc(msg)}</div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, bad ? 6000 : 3200);
}
function confirmBox({ title, body = '', ok = 'OK', danger = false, cancel = 'Cancel' }) {
  return new Promise(res => {
    const d = $('#dlg');
    d.innerHTML = `<div class="dl-in"><h3>${esc(title)}</h3><div class="muted">${body}</div></div>
      <div class="dl-acts"><button class="btn ghost" data-v="0">${esc(cancel)}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-v="1">${esc(ok)}</button></div>`;
    d.onclick = e => { const b = e.target.closest('[data-v]'); if (b) { d.close(); res(b.dataset.v === '1'); } };
    d.oncancel = () => res(false);
    d.showModal();
    $('[data-v="1"]', d).focus();
  });
}
function openMenu(btn, items) {
  closeMenu();
  const m = document.createElement('div');
  m.className = 'menu'; m.id = 'menu';
  m.innerHTML = items.map((it, i) => it === '-' ? '<hr>' : `<button data-i="${i}" class="${it.bad ? 'bad' : ''}">${ico(it.icon || 'arrow')}${esc(it.label)}</button>`).join('');
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(innerWidth - mw - 8, r.right - mw)) + 'px';
  m.style.top = (r.bottom + mh + 8 > innerHeight ? Math.max(8, r.top - mh - 6) : r.bottom + 6) + 'px';
  m.onclick = e => { const b = e.target.closest('[data-i]'); if (b) { closeMenu(); items[+b.dataset.i].fn(); } };
  setTimeout(() => addEventListener('click', closeMenu, { once: true }), 0);
}
function closeMenu() { const m = $('#menu'); if (m) m.remove(); }
addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); if (!$('#dlg').open) closePort(); } });

// ---------------------------------------------------------------- login
function showLogin(msg) {
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#loginerr').textContent = msg || '';
  const bs = $$('#pinboxes input'); bs.forEach(b => b.value = ''); bs[0].focus();
}
function unlock() {
  const v = $$('#pinboxes input').map(b => b.value).join('');
  if (v.length !== 4) return;
  PIN = v; try { localStorage.setItem('slop_pin', v); } catch (_) {}
  boot(true);
}
$$('#pinboxes input').forEach((b, i, all) => {
  b.addEventListener('input', () => { b.value = b.value.replace(/\D/g, '').slice(-1); if (b.value && all[i + 1]) all[i + 1].focus(); if (all.every(x => x.value)) unlock(); });
  b.addEventListener('keydown', e => { if (e.key === 'Backspace' && !b.value && all[i - 1]) all[i - 1].focus(); });
  b.addEventListener('paste', e => { const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4); if (t.length) { e.preventDefault(); t.split('').forEach((c, k) => all[k] && (all[k].value = c)); if (t.length === 4) unlock(); } });
});

// ---------------------------------------------------------------- state & routing
let S = null;
const route = { page: 'library', port: null, tab: 'overview' };
let filter = 'all', query = '';
function parseHash() {
  const h = location.hash.slice(1);
  if (h.startsWith('port=')) { const q = new URLSearchParams(h); route.port = q.get('port'); route.tab = q.get('tab') || 'overview'; }
  else { route.port = null; route.page = ['library', 'add', 'settings', 'activity'].includes(h) ? h : 'library'; }
}
function go(h) { location.hash = h; }
addEventListener('hashchange', () => { parseHash(); render(true); });

let timer = null, lastSig = '';
async function poll() {
  clearTimeout(timer);
  try {
    S = await api('GET', '/api/state');
    const sig = JSON.stringify([S.changed, S.jobs.map(j => [j.state, j.progress, j.message]), S.web, S.battery, S.disk && S.disk.free]);
    if (sig !== lastSig) { lastSig = sig; render(); }
  } catch (e) {}
  const busy = S && (S.busy || S.jobs.some(j => j.state === 'running'));
  timer = setTimeout(poll, busy ? 900 : 3000);
}
async function boot(fromLogin) {
  try { S = await api('GET', '/api/state'); }
  catch (e) { if (fromLogin) showLogin('That PIN didn’t work. Check the handheld’s Connect screen.'); return; }
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  parseHash(); render(true); poll();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) poll(); });

// ---------------------------------------------------------------- model helpers
const STATUS = { current: 'Up to date', update: 'Update', unknown_version: 'Version unknown', not_installed: 'Not installed', error: 'Error' };
const repo = id => S.repos.find(r => r.id === id);
const busyJob = r => r.job && (r.job.state === 'running' || r.job.state === 'queued') ? r.job : null;
function statusOf(r) {
  if (busyJob(r)) return ['working', r.job.state === 'queued' ? 'Queued' : 'Working'];
  if (r.job && r.job.state === 'failed') return ['failed', 'Failed'];
  return [r.status, STATUS[r.status] || r.status];
}
function mainAction(r) {
  if (busyJob(r)) return null;
  if (r.status === 'update' || r.status === 'unknown_version') return { label: `Update to ${shortTag(r.latest_tag)}`, fn: () => install(r.id, r.latest_tag) };
  if (r.status === 'not_installed' && r.latest_tag) return { label: `Install ${shortTag(r.latest_tag)}`, fn: () => install(r.id, r.latest_tag) };
  return null;
}
const updates = () => S.repos.filter(r => r.status === 'update' || r.status === 'unknown_version');

// ---------------------------------------------------------------- actions
async function guarded(path, body, verb) {
  try { return await api('POST', path, body); }
  catch (e) {
    if (e.status === 409 && e.body && e.body.blocked) {
      if (!await confirmBox({ title: `${verb} anyway?`, body: e.body.problems.map(esc).join('<br>'), ok: `${verb} anyway`, danger: true })) return null;
      try { return await api('POST', path, Object.assign({}, body, { force: true })); } catch (e2) { toast(e2.message, true); return null; }
    }
    if (e.status !== 401) toast(e.message, true);
    return null;
  }
}
async function install(id, tag, verb = 'Install', ask = false) {
  const r = repo(id);
  if (ask && !await confirmBox({ title: `${verb} ${r.title} ${shortTag(tag)}?`, body: 'Saves are backed up first. Imported game files and settings stay.', ok: verb })) return;
  if (await guarded(`/api/repos/${id}/install`, { tag }, verb)) toast(`${r.title}: ${verb.toLowerCase()} ${shortTag(tag)} queued`);
  poll();
}
async function updateAll() { const j = await guarded('/api/update-all', {}, 'Update'); if (j) toast(j.queued ? `${j.queued} update${j.queued === 1 ? '' : 's'} queued` : 'Nothing to update'); poll(); }
async function checkAll() { await act(() => api('POST', '/api/check'), 'Checking GitHub for new releases…'); }
async function skip(id, tag, on) { await act(() => api('POST', `/api/repos/${id}/skip`, { tag, skip: on }), on ? `${shortTag(tag)} skipped: not offered as an update` : `${shortTag(tag)} offered again`); }
function uninstall(id) {
  const r = repo(id), d = $('#dlg');
  d.innerHTML = `<div class="dl-in"><h3>Uninstall ${esc(r.title)}?</h3>
    <p class="muted">PortMaster removes <b>ports/${esc(r.port_dir)}</b>, with its imported game data and saves.</p>
    <label class="check"><input type="checkbox" id="bk" checked> First back up ${esc((r.keep_on_uninstall || ['conf']).join(', '))}</label></div>
    <div class="dl-acts"><button class="btn ghost" data-v="0">Cancel</button><button class="btn danger" data-v="1">Uninstall</button></div>`;
  d.onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; const keep = $('#bk').checked; d.close();
    if (b.dataset.v === '1') act(() => api('POST', `/api/repos/${id}/uninstall`, { confirm: 'uninstall', backup: keep }), `Uninstalling ${r.title}`); };
  d.showModal();
}
async function unwatch(id) {
  const r = repo(id);
  if (!await confirmBox({ title: `Stop watching ${r.title}?`, body: 'The installed port stays. The versions kept on the handheld for rollback are deleted.', ok: 'Stop watching', danger: true })) return;
  if (await act(() => api('DELETE', `/api/repos/${id}`), `No longer watching ${r.repo}`) !== null) closePort();
}
async function gogGet(id) { await act(() => api('POST', `/api/repos/${id}/gog-download`), 'Downloading the game files from GOG…'); }

// ---------------------------------------------------------------- render
function render(force) {
  if (!S) return;
  const ups = updates().length, uc = $('#ucount');
  uc.textContent = ups; uc.classList.toggle('hidden', !ups);
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.p === route.page));
  const b = S.battery || {}, d = S.disk || {};
  $('#st-bat').innerHTML = b.percent == null ? '' : `${ico(b.charging ? 'bolt' : 'bat')}${b.percent}%`;
  $('#st-bat').classList.toggle('low', b.percent != null && b.percent < (S.low_battery || 20) && !b.charging);
  $('#st-disk').innerHTML = d.free == null ? '' : `${ico('disk')}${size(d.free)} free`;
  const main = $('#main');
  if (main.dataset.page !== route.page) { main.dataset.page = route.page; main.innerHTML = ''; force = true; }
  ({ library: renderLibrary, add: renderAdd, settings: renderSettings, activity: renderActivity })[route.page](main, force);
  renderDrawer(force);
}
const typing = el => el && el.contains(document.activeElement) && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);

// ---------- library
function coverHtml(r, big) {
  const [c1, c2] = tint(r.repo), pic = r.cover || r.art;
  // a wide picture (a logo) shows whole, over a soft copy of itself: no crop, no bars
  return `<div class="cover">${pic ? `<img class="bg" loading="lazy" src="${coverUrl(r)}" alt=""><img class="fg" loading="lazy" src="${coverUrl(r)}" alt="" onload="if(this.naturalWidth>this.naturalHeight*1.05)this.parentNode.classList.add('wide')">`
    : `<div class="ph" style="--c1:${c1};--c2:${c2}${big ? '' : ';font-size:24px'}">${esc(initials(r.title))}</div>`}</div>`;
}
function card(r) {
  const [st, label] = statusOf(r), job = r.job, a = mainAction(r);
  const vers = `<span class="vtag">${r.installed
    ? `<b>${esc(r.installed_tag ? shortTag(r.installed_tag) : '?')}</b>${r.status === 'update' || r.status === 'unknown_version' ? `${ico('arrow')}<b>${esc(shortTag(r.latest_tag))}</b>` : ''}`

function md(text) {

    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');

  for (const l of esc(text || '').split(/\r?\n/)) {

      if (res && res.status < 500) { const j = await res.json().catch(() => ({})); throw new Error(j.error || 'HTTP ' + res.status); }
      if (++tries >= 8) throw new Error('The connection to the handheld keeps dropping');
      await new Promise(r => setTimeout(r, Math.min(15000, 1500 * tries)));
    }
    onProgress(off);
  }
  return last;
}
async function uploadOne(it) {
  const f = it.file, qs = `name=${encodeURIComponent(it.name)}&total=${f.size}${it.single ? '&single=1' : ''}`;
  const st = await api('GET', `/api/repos/${it.id}/upload?${qs}`);
  if (st.max_file && f.size > st.max_file) throw new Error(`Over ${size(st.max_file)}, the most one file can be on this card (${st.fs || 'FAT32'})`);
  if (st.free != null && st.free < f.size - st.have) throw new Error(`Not enough space on the handheld (${size(st.free)} free)`);
  it.done = st.have; it.t0 = Date.now(); it.d0 = st.have;
  if (st.done) return;
  await sendChunks(`/api/repos/${it.id}/upload?${qs}`, f, st.have, off => { it.done = off; drawUploads(); });
}
function rate(i) { const s = (Date.now() - i.t0) / 1000; return s > 2 ? (i.done - i.d0) / s : 0; }
function drawUploads() {
  const items = UPQ.items;
  const row = i => {
    const sp = rate(i), left = sp ? (i.file.size - i.done) / sp : 0;
    const what = i.state === 'bad' ? esc(i.err) : i.state === 'done' ? 'done' : i.state === 'waiting' ? 'waiting'
      : `${size(i.done)} / ${size(i.file.size)}${sp ? ` · ${size(sp)}/s · ${dur(left)} left` : ''}`;
    return `<div class="up-item"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.name)}</span>
      <span class="small ${i.state === 'bad' ? '' : 'faint'}" style="${i.state === 'bad' ? 'color:var(--danger)' : ''}">${what}</span>
      <div class="progress"><i style="width:${i.file.size ? Math.round(i.done * 100 / i.file.size) : 100}%"></i></div></div>`;
  };
  const list = $('#uplist');
  if (list) list.innerHTML = items.filter(i => i.id === route.port).map(row).join('');
  const box = $('#uploader'), active = items.filter(i => i.state === 'up' || i.state === 'waiting');
  const visibleHere = list && items.some(i => i.id === route.port);
  box.classList.toggle('hidden', !(active.length && !visibleHere));
  if (active.length && !visibleHere) {
    const tot = active.reduce((a, i) => a + i.file.size, 0), dn = active.reduce((a, i) => a + i.done, 0);
    box.innerHTML = `<div class="row" style="justify-content:space-between"><b>Uploading ${active.length} file${active.length === 1 ? '' : 's'}</b><span class="faint">${size(dn)} / ${size(tot)}</span></div>
      <div class="progress" style="margin-top:8px"><i style="width:${tot ? Math.round(dn * 100 / tot) : 0}%"></i></div><div class="faint tiny" style="margin-top:6px">Keep this page open until it's done.</div>`;
  }
}
addEventListener('beforeunload', e => { if (UPQ.items.some(i => i.state === 'up' || i.state === 'waiting')) { e.preventDefault(); e.returnValue = ''; } });

          <button class="btn sm" data-restore="${esc(b.name)}">Restore</button><button class="btn ghost sm icon" title="Delete" aria-label="Delete" data-delb="${esc(b.name)}">${ico('trash')}</button></div></div>`).join('')
        : '<p class="muted small" style="margin:6px 0 0">No backups yet.</p>'}</div>
      <div class="row" style="margin-top:10px"><button class="btn sm" id="bknow">${ico('archive')}Back up saves now</button></div></div>
    <div class="drop" id="bdrop">${ico('up', 'i big')}<h3>Restore from this computer</h3>
      <p class="muted small" style="margin:0 0 12px">A Slopetanium backup zip of this port, from this handheld or another. The current saves are backed up first.${lim.max_file ? '<br>' + fsNote(lim) : ''}</p>
      <label class="btn sm">${ico('archive')}Choose a backup<input type="file" accept=".zip" hidden id="bf"></label>
      <div class="up-list" id="bkst"></div></div></div>`;
  body.onclick = async e => {
    const rs = e.target.closest('[data-restore]');
    if (rs && await confirmBox({ title: `Restore ${rs.dataset.restore}?`, body: 'Its files replace the port’s own. Your current saves are backed up first.', ok: 'Restore' }))
      act(() => api('POST', `/api/repos/${r.id}/restore`, { name: rs.dataset.restore }), 'Restoring…');
    const db = e.target.closest('[data-delb]');
    if (db && await confirmBox({ title: `Delete ${db.dataset.delb}?`, ok: 'Delete', danger: true })) act(() => api('POST', `/api/repos/${r.id}/backup-delete`, { name: db.dataset.delb }), 'Backup deleted');
    if (e.target.closest('#bknow')) act(() => api('POST', `/api/repos/${r.id}/backup`), j => `Saves backed up: ${j.name}`);
  };
  const drop = $('#bdrop', body), pick = f => f && restoreFile(r.id, f);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files[0]); };
  $('#bf', body).onchange = e => pick(e.target.files[0]);
}
async function restoreFile(id, f) {
  if (!/\.zip$/i.test(f.name)) return toast('A backup is a .zip file', true);
  const show = (t, p) => { const st = $('#bkst'); if (st) st.innerHTML = `<div class="up-item"><span>${esc(f.name)}</span><span class="faint small">${t}</span><div class="progress"><i style="width:${p}%"></i></div></div>`; };
  const qs = `name=${encodeURIComponent(f.name)}&total=${f.size}`;
  try {
    const s0 = await api('GET', `/api/repos/${id}/backup-upload?${qs}`);
    if (s0.max_file && f.size > s0.max_file) throw new Error(`This backup is ${size(f.size)}: over ${size(s0.max_file)}, the most one file can be on this card (${s0.fs || 'FAT32'})`);
    if (s0.free != null && s0.free < f.size - s0.have) throw new Error(`Not enough space on the handheld (${size(s0.free)} free)`);
    const t0 = Date.now(), d0 = s0.have;
    const last = await sendChunks(`/api/repos/${id}/backup-upload?${qs}`, f, s0.have, off => {
      const sp = (off - d0) / Math.max(1, (Date.now() - t0) / 1000);
      show(`${size(off)} / ${size(f.size)}${sp > 0 ? ` · ${dur((f.size - off) / sp)} left` : ''}`, Math.round(off * 100 / Math.max(1, f.size)));
    });
    await api('POST', `/api/repos/${id}/restore`, { name: last.saved_as || s0.saved_as });
    toast('Uploaded: restoring…'); poll();
  } catch (e) { toast(e.message, true); show(esc(e.message), 0); }
}
